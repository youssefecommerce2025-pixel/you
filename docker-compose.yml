# Lancement en une commande :  docker compose up --build
# Puis ouvrir http://localhost:3000

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # --- Obligatoire : change ce token pour l'acces au CRM ---
      ADMIN_TOKEN: "change-moi-en-production"
      # --- Optionnel ---
      # PUBLIC_BASE_URL: "https://ton-domaine.fr"
      # DOUBLE_OPTIN: "1"
      # SMTP_HOST: "smtp.exemple.fr"
      # SMTP_PORT: "587"
      # SMTP_USER: "..."
      # SMTP_PASS: "..."
      # MAIL_FROM: "no-reply@ton-domaine.fr"
      # WHATSAPP_NUMBER: "32470000000"
      # SMS_API_URL: "https://api.fournisseur-sms.be/send"
      # SMS_API_KEY: "..."
      # PARTNER_WEBHOOK_URL: "https://crm-partenaire.be/webhook"
      # PARTNER_WEBHOOK_SECRET: "secret-hmac"
      # PARTNER_API_KEYS: "cle1:Affilie1,cle2:Affilie2"
    volumes:
      # Persistance de la base SQLite entre les redemarrages.
      - leads_data:/app/data
    restart: unless-stopped

volumes:
  leads_data:
